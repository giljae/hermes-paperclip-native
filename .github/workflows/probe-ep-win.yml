name: Probe embedded Postgres (Windows)

# 일회성 진단용(수동 전용). Windows 실제 설치 스모크가 실패하는 근본 원인을
# 찾기 위한 프로브 모음. 끝나면 지운다.
on:
  workflow_dispatch:

jobs:
  # A) embedded-postgres 의 initdb 가 Windows 러너에서 왜 실패하는가
  probe-ep-win:
    name: embedded Postgres initdb 진단 (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 환경 정보
        shell: pwsh
        run: |
          node --version
          npm --version
          Write-Host "whoami      : $(whoami)"
          Write-Host "RUNNER_TEMP : $env:RUNNER_TEMP"
          Write-Host "LOCALAPPDATA: $env:LOCALAPPDATA"

      - name: embedded-postgres 바이너리 내려받기
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ep = Join-Path $env:RUNNER_TEMP "ep"
          Remove-Item -LiteralPath $ep -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $ep | Out-Null
          Push-Location $ep
          npm pack "@embedded-postgres/windows-x64@18.1.0-beta.16"
          $tgz = (Get-ChildItem -Filter *.tgz | Select-Object -First 1).FullName
          tar -xzf $tgz
          Pop-Location
          $initdb = Join-Path $ep "package\native\bin\initdb.exe"
          Write-Host "initdb: $initdb"
          if (-not (Test-Path -LiteralPath $initdb)) { throw "initdb not found" }

      - name: initdb 진단 (여러 위치/조건, 2>&1 전체 캡처)
        shell: pwsh
        run: |
          $initdb = Join-Path $env:RUNNER_TEMP "ep\package\native\bin\initdb.exe"
          $pw = Join-Path $env:RUNNER_TEMP "probe-pw.txt"
          Set-Content -LiteralPath $pw -Value "paperclip" -Encoding ascii

          function Invoke-Probe {
            param([string]$Label, [string]$Root, [switch]$PreCreate)
            Write-Host ""
            Write-Host "############ $Label"
            Write-Host "pgdata: $Root"
            Remove-Item -LiteralPath $Root -Recurse -Force -ErrorAction SilentlyContinue
            if ($PreCreate) { New-Item -ItemType Directory -Force -Path $Root | Out-Null }
            Write-Host "--- initdb (server-identical args) ---"
            & $initdb "--pgdata=$Root" "--auth=password" "--username=paperclip" `
              "--pwfile=$pw" "--lc-messages=en_US.UTF-8" `
              "--encoding=UTF8" "--locale=C" "--lc-messages=C" 2>&1 |
              ForEach-Object { Write-Host $_ }
            Write-Host "--- exit code: $LASTEXITCODE ---"
            Write-Host "--- PG_VERSION exists: $(Test-Path -LiteralPath (Join-Path $Root 'PG_VERSION')) ---"
          }

          Invoke-Probe "A) RUNNER_TEMP(D:) fresh dir (no parent)" (Join-Path $env:RUNNER_TEMP "probe-a\db")
          Invoke-Probe "B) RUNNER_TEMP(D:) pre-existing empty dir" (Join-Path $env:RUNNER_TEMP "probe-b\db") -PreCreate
          Invoke-Probe "C) LOCALAPPDATA(C:) pre-existing empty dir" (Join-Path $env:LOCALAPPDATA "Temp\probe-c\db") -PreCreate

          Write-Host ""
          Write-Host "=== PROBE A DONE ==="
          exit 0

  # B) Windows PowerShell 5.1 에서 JSON 인자를 네이티브(node)에 어떻게 넘겨야
  #    한 개의 argv 로 도착하는가. 현재 코드의 backslash-quote 이스케이프가 왜
  #    깨지는지 확인한다.
  #
  #    주의: 이 스텝은 Windows PowerShell 5.1 로 돌기 때문에 스크립트에 ASCII 만
  #    쓴다(비ASCII 는 BOM 없는 파일에서 코드페이지로 오독되어 ParserError 가 된다).
  probe-ps51-arg:
    name: PowerShell 5.1 JSON arg 전달 진단 (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: prepare argv.js
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "argprobe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -LiteralPath (Join-Path $dir "argv.js") `
            -Value 'console.log(JSON.stringify(process.argv.slice(2)))' -Encoding ascii
          Get-Content -LiteralPath (Join-Path $dir "argv.js")

      - name: compare arg passing styles under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $js = Join-Path $env:RUNNER_TEMP "argprobe\argv.js"
          $node = (Get-Command node).Source
          $json = '{"name":"My AI Company","issuePrefix":"AI"}'
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          Write-Host "node: $node"
          Write-Host "json: $json"

          Write-Host ""
          Write-Host "=== 1) raw (no escaping) ==="
          & $node $js --payload-json $json

          Write-Host ""
          Write-Host "=== 2) current code: quote -> backslash-quote ==="
          & $node $js --payload-json ($json.Replace('"','\"'))

          Write-Host ""
          Write-Host "=== 3) .NET Process + manual Windows quoting ==="
          function Quote-WinArg([string]$a) {
            if ($a -notmatch '[\s"]') { return $a }
            $sb = New-Object Text.StringBuilder
            [void]$sb.Append('"')
            $bs = 0
            foreach ($ch in $a.ToCharArray()) {
              if ($ch -eq '\') { $bs++; continue }
              if ($ch -eq '"') {
                [void]$sb.Append('\' * (2*$bs + 1)); [void]$sb.Append('"'); $bs = 0; continue
              }
              if ($bs -gt 0) { [void]$sb.Append('\' * $bs); $bs = 0 }
              [void]$sb.Append($ch)
            }
            [void]$sb.Append('\' * (2*$bs)); [void]$sb.Append('"')
            return $sb.ToString()
          }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $node
          $psi.Arguments = (@($js, '--payload-json', $json) | ForEach-Object { Quote-WinArg $_ }) -join ' '
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $o = $p.StandardOutput.ReadToEnd(); $e = $p.StandardError.ReadToEnd(); $p.WaitForExit()
          Write-Host "stdout: $o"
          if ($e) { Write-Host "stderr: $e" }
          Write-Host "exit  : $($p.ExitCode)"

          Write-Host ""
          Write-Host "=== PROBE B DONE ==="
          exit 0

  # D) 러너는 승격된 관리자(High integrity)라 postgres 가 기동을 거부한다.
  #    runas /trustlevel:0x20000 (제한 토큰 = Basic User) 로 de-elevate 가 되는지,
  #    되면 postgres 가 실제로 기동하는지 본다. (pg_ctl 은 hang 하므로 직접 실행)
  probe-reelevate:
    name: De-elevation (runas trustlevel) + postgres start
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: download ep binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ep = Join-Path $env:RUNNER_TEMP "ep3"
          Remove-Item -LiteralPath $ep -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $ep | Out-Null
          Push-Location $ep
          npm pack "@embedded-postgres/windows-x64@18.1.0-beta.16"
          tar -xzf (Get-ChildItem -Filter *.tgz | Select-Object -First 1).FullName
          Pop-Location

      - name: de-elevate and start postgres
        shell: pwsh
        run: |
          $bin   = Join-Path $env:RUNNER_TEMP "ep3\package\native\bin"
          $initdb = Join-Path $bin "initdb.exe"
          $postgres = Join-Path $bin "postgres.exe"
          $root = Join-Path $env:LOCALAPPDATA "reprobe"
          $dir = Join-Path $root "db"
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pw = Join-Path $root "pw.txt"
          Set-Content -LiteralPath $pw -Value "paperclip" -Encoding ascii
          & $initdb "--pgdata=$dir" "--auth=password" "--username=paperclip" "--pwfile=$pw" "--encoding=UTF8" "--locale=C" "--lc-messages=C" 2>&1 | Write-Host
          Write-Host "initdb exit: $LASTEXITCODE"

          $out = Join-Path $root "out.txt"
          $pglog = Join-Path $root "pg.log"
          $wrapper = Join-Path $root "run.cmd"
          $inner = @(
            "@echo off",
            "whoami /groups | findstr /i Administrators",
            "echo ---- launch postgres ----",
            "start `"`" /b `"$postgres`" -D `"$dir`" -p 54329 1> `"$pglog`" 2>&1",
            "timeout /t 6 /nobreak >nul",
            "tasklist /fi `"imagename eq postgres.exe`"",
            "echo ---- pg.log ----",
            "type `"$pglog`""
          ) -join "`r`n"
          Set-Content -LiteralPath $wrapper -Value ($inner + "`r`n") -Encoding ascii
          $launcher = Join-Path $root "launch.cmd"
          Set-Content -LiteralPath $launcher -Value ("@echo off`r`ncall `"$wrapper`" > `"$out`" 2>&1") -Encoding ascii

          try {
            $p = Start-Process -FilePath "runas" -ArgumentList "/trustlevel:0x20000", $launcher -Wait -PassThru
            Write-Host "runas exit: $($p.ExitCode)"
          } catch { Write-Host "runas error: $($_.Exception.Message)" }

          Write-Host "--- wrapper output ---"
          if (Test-Path -LiteralPath $out) { Get-Content -LiteralPath $out | ForEach-Object { Write-Host $_ } } else { Write-Host "(no out.txt)" }
          Write-Host "--- pg.log ---"
          if (Test-Path -LiteralPath $pglog) { Get-Content -LiteralPath $pglog | ForEach-Object { Write-Host $_ } } else { Write-Host "(no pg.log)" }
          taskkill /f /im postgres.exe 2>&1 | Write-Host
          Write-Host "=== PROBE D DONE ==="
          exit 0
