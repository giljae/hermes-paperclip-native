name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 단위 테스트 + DRY_RUN 스모크
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 셸 문법 검사
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done

      - name: 단위 테스트
        run: make test

      - name: DRY_RUN 스모크 (네트워크/디스크를 쓰지 않음)
        env:
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            .superpowers/sdd/**/*.txt
          if-no-files-found: ignore

  test-linux:
    name: Linux 단위 테스트 + DRY_RUN 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 셸 문법 검사
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done

      - name: 단위 테스트
        run: make test

      - name: DRY_RUN 스모크
        env:
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh

  test-windows:
    name: Windows 단위 테스트
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 7 테스트
        shell: pwsh
        run: ./tests/win/run.ps1

      # 대상 런타임은 Windows 10/11 기본 내장인 Windows PowerShell 5.1 이다.
      # 5.1 은 BOM/문법이 7 과 달라 여기서 실제로 돌려야 한다.
      - name: Windows PowerShell 5.1 테스트
        shell: powershell
        run: ./tests/win/run.ps1

  smoke-real:
    name: 실제 설치 스모크 · macOS (수동 전용 · 무겁다)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 여유
        run: df -h /
      - name: 실제 설치 → 멱등 → 업데이트 → 제거
        env:
          HC_SMOKE_REAL: "1"
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh

  smoke-real-linux:
    name: 실제 설치 스모크 · Linux (수동 전용 · 무겁다)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 여유 (설치 전)
        run: df -h /
      - name: 실제 설치 → 시드 → 멱등 → 업데이트 → 제거
        env:
          HC_SMOKE_REAL: "1"
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh
      - name: 디스크 여유 (설치 후)
        if: always()
        run: df -h /

  smoke-real-windows:
    name: 실제 설치 스모크 · Windows (수동 전용 · 무겁다)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 버전
        shell: powershell
        run: $PSVersionTable | Out-String
      # 대상 런타임인 Windows PowerShell 5.1 로 실제 설치를 검증한다.
      #
      # 러너는 승격된 관리자(High integrity)라 postgres.exe 가 기동을 거부한다.
      # 그래서 스모크 전체를 제한 토큰(Basic User)으로 실행한다:
      # runas /trustlevel:0x20000. 결과는 파일로 받아 폴링한다(runas 는 백그라운드
      # 서버가 살아 있는 동안 -Wait 로 돌아오지 않는다).
      - name: 실제 설치 → 시드 → 멱등 → 업데이트 → 제거 (제한 토큰)
        shell: powershell
        run: |
          # ASCII only: Windows PowerShell 5.1 은 이 파일을 OEM 코드페이지로 읽어
          # 비ASCII 가 있으면 파싱이 깨진다.
          $smoke = Join-Path (Get-Location) "tests/win/smoke.ps1"
          $ps = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $log = Join-Path $env:RUNNER_TEMP "smoke-restricted.log"
          $cmd = Join-Path $env:RUNNER_TEMP "smoke-restricted.cmd"
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          $lines = @(
            "@echo off",
            "set HC_SMOKE_REAL=1",
            "`"$ps`" -NoProfile -ExecutionPolicy Bypass -File `"$smoke`" > `"$log`" 2>&1",
            "echo SMOKE_EXIT=%ERRORLEVEL% >> `"$log`""
          ) -join "`r`n"
          Set-Content -LiteralPath $cmd -Value $lines -Encoding ascii

          Write-Host "launching smoke under a restricted token..."
          Start-Process -FilePath "runas" -ArgumentList "/trustlevel:0x20000", $cmd | Out-Null

          $deadline = (Get-Date).AddMinutes(40)
          $code = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if (Test-Path -LiteralPath $log) {
              $c = Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              if ($c -match "SMOKE_EXIT=(\d+)") { $code = [int]$Matches[1]; break }
            }
          }
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | ForEach-Object { Write-Host $_ } }
          if ($null -eq $code) { Write-Host "restricted smoke did not finish in time" -ForegroundColor Red; exit 1 }
          if ($code -ne 0) { Write-Host "restricted smoke exit: $code" -ForegroundColor Red; exit $code }
          Write-Host "restricted smoke OK"
      - name: 실패 시 가짜 홈 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-smoke-home
          # 가짜 홈은 C: 에 있어 runner.temp 글롭과 맞지 않는다. 스모크가 실패 시
          # 로그만 RUNNER_TEMP(D:)의 win-smoke-logs 로 복사한다.
          path: |
            ${{ runner.temp }}/win-smoke-logs/**
          include-hidden-files: true
          if-no-files-found: ignore
