name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 단위 테스트 + DRY_RUN 스모크
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 셸 문법 검사
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done

      - name: 단위 테스트
        run: make test

      - name: DRY_RUN 스모크 (네트워크/디스크를 쓰지 않음)
        env:
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            .superpowers/sdd/**/*.txt
          if-no-files-found: ignore

  test-linux:
    name: Linux 단위 테스트 + DRY_RUN 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 셸 문법 검사
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done

      - name: 단위 테스트
        run: make test

      - name: DRY_RUN 스모크
        env:
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh

  test-windows:
    name: Windows 단위 테스트
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 7 테스트
        shell: pwsh
        run: ./tests/win/run.ps1

      # 대상 런타임은 Windows 10/11 기본 내장인 Windows PowerShell 5.1 이다.
      # 5.1 은 BOM/문법이 7 과 달라 여기서 실제로 돌려야 한다.
      - name: Windows PowerShell 5.1 테스트
        shell: powershell
        run: ./tests/win/run.ps1

  smoke-real:
    name: 실제 설치 스모크 · macOS (수동 전용 · 무겁다)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 여유
        run: df -h /
      - name: 실제 설치 → 멱등 → 업데이트 → 제거
        env:
          HC_SMOKE_REAL: "1"
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh

  smoke-real-linux:
    name: 실제 설치 스모크 · Linux (수동 전용 · 무겁다)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 여유 (설치 전)
        run: df -h /
      - name: 실제 설치 → 시드 → 멱등 → 업데이트 → 제거
        env:
          HC_SMOKE_REAL: "1"
          HC_SKIP_AUTOSTART: "1"
          HC_SKIP_OPEN: "1"
          HC_NO_COLOR: "1"
        run: bash tests/smoke.sh
      - name: 디스크 여유 (설치 후)
        if: always()
        run: df -h /

  smoke-real-windows:
    name: 실제 설치 스모크 · Windows (수동 전용 · 무겁다)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 버전
        shell: powershell
        run: $PSVersionTable | Out-String
      # 대상 런타임인 Windows PowerShell 5.1 로 실제 설치를 검증한다.
      - name: 실제 설치 → 시드 → 멱등 → 업데이트 → 제거
        shell: powershell
        env:
          HC_SMOKE_REAL: "1"
        run: ./tests/win/smoke.ps1
      - name: 실패 시 가짜 홈 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-smoke-home
          # 가짜 홈은 C: 에 있어 runner.temp 글롭과 맞지 않는다. 스모크가 실패 시
          # 로그만 RUNNER_TEMP(D:)의 win-smoke-logs 로 복사한다.
          path: |
            ${{ runner.temp }}/win-smoke-logs/**
          include-hidden-files: true
          if-no-files-found: ignore
